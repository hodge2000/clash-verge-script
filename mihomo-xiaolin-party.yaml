# 代理组 (来自 tun.txt 中的 proxy-groups)
proxy-groups:
  - name: "节点选择"
    type: "select"
    proxies: ["延迟选优", "故障转移", "♻️自动点选", "DIRECT", "HK香港节点", "JP日本节点", "US美国节点", "TW台湾节点", "KR韩国节点", "SG狮城节点"]

  - name: "延迟选优"
    type: "url-test"
    interval: 300
    tolerance: 100
    include-all: true
    timeout: 3000
    url: "https://www.google.com/generate_204"
    lazy: true
    max-failed-times: 3
    hidden: false
    icon: "https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/speed.svg"
  - name: "故障转移"
    type: "fallback"
    include-all: true
    interval: 300
    timeout: 3000
    url: "https://www.google.com/generate_204"
    lazy: true
    max-failed-times: 3
    hidden: false
    icon: "https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/ambulance.svg"
  - name: "♻️自动点选"
    type: "url-test"
    interval: 300
    tolerance: 100
    include-all: true
    timeout: 3000
    filter: "^(?!(CN|香港|港|HK|Hong Kong|Hongkong|🇭🇰|Hong Kong|HongKong|新加坡|坡|狮城|SG|Singapore|俄罗斯|RU|直连)).*$"
    url: "https://www.google.com/generate_204"
    lazy: true
    max-failed-times: 3
    hidden: false
    icon: "https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/speed.svg"
  - name: "谷歌服务"
    type: "select"
    proxies: ["延迟选优", "♻️自动点选", "故障转移", "JP日本节点", "US美国节点", "TW台湾节点", "KR韩国节点", "SG狮城节点", "HK香港节点"]

  - name: "YouTube"
    type: "select"
    proxies: ["延迟选优", "♻️自动点选", "故障转移", "JP日本节点", "US美国节点", "TW台湾节点", "KR韩国节点", "SG狮城节点", "HK香港节点"]

  - name: "Netflix"
    type: "select"
    proxies: ["奈飞节点", "延迟选优", "♻️自动点选", "故障转移","DIRECT", "JP日本节点", "US美国节点", "TW台湾节点", "KR韩国节点", "SG狮城节点", "HK香港节点"]

  - name: "电报消息"
    type: "select"
    proxies: ["奈飞节点", "延迟选优", "♻️自动点选", "故障转移", "JP日本节点", "US美国节点", "TW台湾节点", "KR韩国节点", "SG狮城节点", "HK香港节点"]

  - name: "ChatGPT"
    type: "select"
    include-all: true
    proxies: ["US美国节点", "延迟选优", "♻️自动点选", "故障转移", "JP日本节点", "TW台湾节点", "KR韩国节点", "SG狮城节点", "HK香港节点"]

  - name: "微软服务"
    type: "select"
    proxies: ["延迟选优", "♻️自动点选", "故障转移","DIRECT", "JP日本节点", "US美国节点", "TW台湾节点", "KR韩国节点", "SG狮城节点", "HK香港节点"]

  - name: "苹果服务"
    type: "select"
    proxies: ["DIRECT", "延迟选优", "♻️自动点选", "故障转移","JP日本节点", "US美国节点", "TW台湾节点", "KR韩国节点", "SG狮城节点", "HK香港节点"]

  - name: "动画疯"
    type: "select"
    proxies: ["延迟选优", "♻️自动点选", "故障转移","DIRECT", "JP日本节点", "US美国节点", "TW台湾节点", "KR韩国节点", "SG狮城节点", "HK香港节点"]
    include-all: true
    filter: "(?i)台|tw|TW"

  - name: "Spotify"
    type: "select"
    proxies: ["延迟选优", "♻️自动点选", "故障转移","DIRECT", "JP日本节点", "US美国节点", "TW台湾节点", "KR韩国节点", "SG狮城节点", "HK香港节点"]

  - name: "广告过滤"
    type: "select"
    proxies: ["REJECT", "DIRECT"]
    interval: 300
    timeout: 3000
    url: "https://www.google.com/generate_204"
    lazy: true
    max-failed-times: 3
    hidden: false
    icon: "https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/bug.svg"
  - name: "全局直连"
    type: "select"
    proxies: ["DIRECT", "节点选择", "延迟选优", "故障转移"]
    include-all: true
    interval: 300
    timeout: 3000
    url: "https://www.google.com/generate_204"
    lazy: true
    max-failed-times: 3
    hidden: false
    icon: "https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/link.svg"
  - name: "全局拦截"
    type: "select"
    proxies: ["REJECT", "DIRECT"]
    interval: 300
    timeout: 3000
    url: "https://www.google.com/generate_204"
    lazy: true
    max-failed-times: 3
    hidden: false
    icon: "https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/block.svg"
  - name: "漏网之鱼"
    type: "select"
    proxies: ["延迟选优", "故障转移", "♻️自动点选", "全局直连", "HK香港节点", "JP日本节点", "US美国节点", "TW台湾节点", "KR韩国节点", "SG狮城节点"]
    include-all: true
    interval: 300
    timeout: 3000

  # === 🌏 地区策略组（URL-TEST 自动优选） ===
  - name: "HK香港节点"
    type: "url-test"
    include-all-proxies: true
    filter: "(港|HK|Hong Kong|Hongkong|🇭🇰)"
