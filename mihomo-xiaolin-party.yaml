    include-all-proxies: true
    filter: "(新加坡|坡|狮城|SG|Singapore|🇸🇬)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    timeout: 200
  - name: "KR韩国节点"
    type: "url-test"
    include-all-proxies: true
    filter: "(韩国|首尔|韩|韓|KR|Korea|KOR|Incheon|🇰🇷)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    timeout: 2000
  - name: "奈飞节点"
    type: "select"
    include-all-proxies: true
    filter: "(NF|奈飞|解锁|Netflix|NETFLIX|Media)"

